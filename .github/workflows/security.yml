name: Security CI

on:
  push:
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 14

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: SAST - Semgrep
        id: semgrep
        continue-on-error: true
        uses: semgrep/semgrep-action@v1
        with:
          config: p/javascript

      - name: Dependency Security - npm audit
        id: npm_audit
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Secrets Scan - Gitleaks
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2

      - name: Build Docker image
        run: docker build -t nodegoat:ci .

      - name: Container Security - Trivy
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: nodegoat:ci
          format: table
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
       
      - name: Security Gate Result
        if: always()
        run: |
          echo "Semgrep: ${{ steps.semgrep.outcome }}"
          echo "npm audit: ${{ steps.npm_audit.outcome }}"
          echo "Gitleaks: ${{ steps.gitleaks.outcome }}"
          echo "Trivy: ${{ steps.trivy.outcome }}"

          if [ "${{ steps.gitleaks.outcome }}" != "success" ]; then
            echo "Secrets gate failed."
            exit 1
          fi

          echo "Security scans completed. Known baseline findings are documented; secrets gate passed."

          echo "All security gates passed."